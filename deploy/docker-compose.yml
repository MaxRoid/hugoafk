version: '3.8'

services:
  hugoafk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hugoafk_app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ../data:/app/data
      - ../addons:/app/addons
    environment:
      - NODE_ENV=production
      - PORT=3001
